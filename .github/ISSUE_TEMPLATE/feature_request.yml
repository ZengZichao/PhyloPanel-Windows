name: Feature request
description: Suggest an improvement to PhyloPanel
labels: ['enhancement']
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or workflow that is awkward today
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
